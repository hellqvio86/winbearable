name: CI/CD

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      job:
        description: 'Select which job to run'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - lint
          - test
          - draft-release
          - publish
          - winget-asset
      release_tag:
        description: 'Existing release tag to rebuild the Winget asset for (winget-asset only, e.g. v0.30.1)'
        required: false
        type: string

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    if: |
      github.event_name != 'workflow_dispatch' ||
      inputs.job == 'all' ||
      inputs.job == 'lint'
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.15"

      - name: Verify uv.lock is up-to-date
        run: uv lock --check

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run ruff check
        run: uv run ruff check .

      - name: Run ruff format check
        run: uv run ruff format --check .

      - name: Run mypy strict type check
        run: uv run mypy src

  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    if: |
      github.event_name != 'workflow_dispatch' ||
      inputs.job == 'all' ||
      inputs.job == 'test'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.15", "3.15t"]

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Verify uv.lock is up-to-date
        run: uv lock --check

      - name: Install dependencies
        run: uv sync --frozen

      - name: Print hypothesis wheel/module info
        run: uv run python -c "import hypothesis; print(hypothesis.__version__, hypothesis.__file__)"

      - name: Run tests
        run: uv run pytest --cov=src/winbearable --cov-report=term-missing --cov-fail-under=89

      - name: Generate coverage badge
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.15'
        run: uv run python bin/generate_badge.py

      - name: Upload coverage report and badge
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.15'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage-badge
          path: coverage.svg

  mutation-gate:
    name: Mutation Gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: |
      github.event_name != 'workflow_dispatch' ||
      inputs.job == 'all' ||
      inputs.job == 'test'
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.15"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run deterministic mutation gate
        run: uv run python bin/check_mutations.py

  windows-contracts:
    name: Windows Contracts & Read-Only Integration
    runs-on: windows-latest
    permissions:
      contents: read
    if: |
      github.event_name != 'workflow_dispatch' ||
      inputs.job == 'all' ||
      inputs.job == 'test'
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.15"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Record Windows build & Python runtime
        shell: pwsh
        run: |
          $os = Get-CimInstance Win32_OperatingSystem
          Write-Output "Windows Build: $($os.BuildNumber) ($($os.Caption))"
          uv run python -c "import sys; print('Python:', sys.version)"

      - name: Run contract, unit & read-only Windows integration tests
        env:
          WINBEARABLE_RUN_WINDOWS_INTEGRATION: "1"
        run: uv run pytest tests/contracts tests/test_windows_integration.py tests/test_property_invariants.py tests/audit tests/backends tests/cli tests/engine tests/operations tests/uac tests/wsl tests/test_catalog_lint.py tests/test_architecture_invariants.py -q --no-cov

  all-checks:
    name: All Checks Passed
    if: always()
    needs: [lint, test, mutation-gate, windows-contracts]
    outputs:
      success: ${{ steps.check.outputs.success }}
    runs-on: ubuntu-latest
    steps:
      - name: Check all jobs
        id: check
        run: |
          LINT_RESULT="${{ needs.lint.result }}"
          TEST_RESULT="${{ needs.test.result }}"
          MUT_RESULT="${{ needs.mutation-gate.result }}"
          WIN_RESULT="${{ needs.windows-contracts.result }}"
          REQUIRE_BOTH="${{ (github.event_name == 'workflow_dispatch' && (inputs.job == 'publish' || inputs.job == 'draft-release')) && 'true' || 'false' }}"
          if [[ "$REQUIRE_BOTH" == "true" ]]; then
            if [[ "$LINT_RESULT" == "success" ]] && [[ "$TEST_RESULT" == "success" ]] && [[ "$MUT_RESULT" == "success" ]] && [[ "$WIN_RESULT" == "success" ]]; then
              echo "success=true" >> $GITHUB_OUTPUT
              echo "All required release checks passed!"
            else
              echo "success=false" >> $GITHUB_OUTPUT
              echo "Release/publish requires lint, test, mutation-gate, and windows-contracts to succeed (not skipped)."
              exit 1
            fi
          elif [[ "$LINT_RESULT" == "success" || "$LINT_RESULT" == "skipped" ]] && \
             [[ "$TEST_RESULT" == "success" || "$TEST_RESULT" == "skipped" ]] && \
             [[ "$MUT_RESULT" == "success" || "$MUT_RESULT" == "skipped" ]] && \
             [[ "$WIN_RESULT" == "success" || "$WIN_RESULT" == "skipped" ]]; then
            echo "success=true" >> $GITHUB_OUTPUT
            echo "All executed checks passed!"
          else
            echo "success=false" >> $GITHUB_OUTPUT
            echo "One or more checks failed"
            exit 1
          fi

  draft-release:
    name: Draft Release
    runs-on: ubuntu-latest
    needs: [all-checks]
    if: |
      always() &&
      needs.all-checks.outputs.success == 'true' &&
      (
        (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
        (github.event_name == 'workflow_dispatch' && (inputs.job == 'all' || inputs.job == 'draft-release'))
      )
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Check version change
        id: check_version
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch --tags --force
          CURRENT_VERSION=$(grep -m 1 '^__version__ = ' src/winbearable/const.py | cut -d '"' -f 2)

          if [ -n "$CURRENT_VERSION" ] && ! gh release view "v${CURRENT_VERSION}" >/dev/null 2>&1; then
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Install uv
        if: steps.check_version.outputs.changed == 'true'
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true

      - name: Set up Python
        if: steps.check_version.outputs.changed == 'true'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.15"

      - name: Build package
        if: steps.check_version.outputs.changed == 'true'
        run: |
          uv build
          sha256sum dist/*.whl dist/*.tar.gz > dist/SHA256SUMS.txt

      - name: Generate SBOM for built artifacts
        if: steps.check_version.outputs.changed == 'true'
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: dist
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Create Git tag (only after build and SBOM succeed)
        if: steps.check_version.outputs.changed == 'true'
        run: |
          if ! git rev-parse "v${{ steps.check_version.outputs.version }}" >/dev/null 2>&1; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag -a "v${{ steps.check_version.outputs.version }}" -m "Release v${{ steps.check_version.outputs.version }}"
            git push origin "v${{ steps.check_version.outputs.version }}"
          fi

      - name: Generate Changelog
        if: steps.check_version.outputs.changed == 'true'
        shell: bash
        run: |
          git fetch --tags --force
          TAGS=$(git tag --sort=-v:refname | grep -E '^v[0-9]')
          TAG_COUNT=$(echo "$TAGS" | grep -c -E '^v[0-9]' || echo 0)
          echo "## Changelog" > changelog.md
          echo "" >> changelog.md
          if [ "$TAG_COUNT" -le 1 ]; then
            git log --pretty=format:"* %s (%h)" --no-merges >> changelog.md
          else
            PREV_TAG=$(echo "$TAGS" | sed -n '2p')
            git log ${PREV_TAG}..HEAD --pretty=format:"* %s (%h)" --no-merges >> changelog.md
          fi
          echo "" >> changelog.md

      - name: Create Release Draft
        if: steps.check_version.outputs.changed == 'true'
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3
        with:
          tag_name: v${{ steps.check_version.outputs.version }}
          name: v${{ steps.check_version.outputs.version }}
          draft: true
          body_path: changelog.md
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS.txt
            sbom.spdx.json
          token: ${{ secrets.GITHUB_TOKEN }}

  publish:
    name: Build and Publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    needs: [all-checks]
    environment:
      name: pypi
      url: https://pypi.org/p/winbearable
    if: |
      always() &&
      needs.all-checks.outputs.success == 'true' &&
      (
        (github.event_name == 'release' && github.event.action == 'published') ||
        (github.event_name == 'workflow_dispatch' && inputs.job == 'publish')
      )
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.15"

      - name: Verify release tag matches package version
        shell: bash
        run: |
          PKG_VER=$(PYTHONPATH=src python -c "from winbearable.const import __version__; print(__version__)")
          if [ "${{ github.ref_type }}" = "tag" ]; then
            if [ "${{ github.ref_name }}" != "v${PKG_VER}" ]; then
              echo "Tag '${{ github.ref_name }}' does not match const.__version__ 'v${PKG_VER}'"
              exit 1
            fi
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if ! git tag --points-at HEAD | grep -Fxq "v${PKG_VER}"; then
              echo "HEAD must carry tag 'v${PKG_VER}' for workflow_dispatch publish"
              exit 1
            fi
          else
            echo "Publishing release requires a git tag ref (got ref_type=${{ github.ref_type }})"
            exit 1
          fi

      - name: Build and hash package
        run: |
          uv build
          (cd dist && sha256sum *.whl *.tar.gz > ../SHA256SUMS.txt && sha256sum -c ../SHA256SUMS.txt)

      - name: Generate SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: dist/
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Attest build provenance
        uses: actions/attest-build-provenance@9d57eef8c06cd9d6b433effeeb7a6a77b3ff94ad # v4.2.2
        with:
          subject-path: dist/*

      - name: Upload release assets and SBOM
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3
        with:
          files: |
            dist/*.whl
            dist/*.tar.gz
            SHA256SUMS.txt
            sbom.spdx.json
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          packages-dir: dist/

  publish-winget-asset:
    name: Build and Attach Winget Zip (Release Only)
    runs-on: windows-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    needs: [all-checks]
    if: |
      always() &&
      needs.all-checks.outputs.success == 'true' &&
      (
        (github.event_name == 'release' && github.event.action == 'published') ||
        (github.event_name == 'workflow_dispatch' && inputs.job == 'winget-asset' && inputs.release_tag != '')
      )
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.15"

      - name: Verify release tag matches package version
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          PKG_VER=$(PYTHONPATH=src python -c "from winbearable.const import __version__; print(__version__)")
          if [ "${RELEASE_TAG}" != "v${PKG_VER}" ]; then
            echo "Tag '${RELEASE_TAG}' does not match const.__version__ 'v${PKG_VER}'"
            exit 1
          fi

      - name: Install dependencies
        run: uv sync --frozen

      - name: Build Winget portable binary
        run: uv run --group release --frozen python bin/build_winget.py --build-only

      - name: Sign wb.exe with Authenticode (if secret configured)
        shell: pwsh
        env:
          WIN_SIGNING_CERT_PFX_B64: ${{ secrets.WIN_SIGNING_CERT_PFX_B64 }}
          WIN_SIGNING_CERT_PASSWORD: ${{ secrets.WIN_SIGNING_CERT_PASSWORD }}
          WIN_SIGNING_TIMESTAMP_URL: ${{ vars.WIN_SIGNING_TIMESTAMP_URL }}
          WIN_SIGNING_EXPECTED_THUMBPRINT: ${{ vars.WIN_SIGNING_EXPECTED_THUMBPRINT }}
        run: |
          if (-not $env:WIN_SIGNING_CERT_PFX_B64 -or -not $env:WIN_SIGNING_CERT_PASSWORD) {
            Write-Output "::notice::WIN_SIGNING_CERT_PFX_B64 / WIN_SIGNING_CERT_PASSWORD not set; skipping Authenticode signing (unsigned build)."
            "SIGNATURE_STATUS=unsigned" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            exit 0
          }
          $pfxBytes = [Convert]::FromBase64String($env:WIN_SIGNING_CERT_PFX_B64)
          $cert = [System.Security.Cryptography.X509Certificates.X509Certificate2]::new(
            $pfxBytes,
            $env:WIN_SIGNING_CERT_PASSWORD
          )
          $publicCert = $null
          $rootStore = $null
          $addedToRoot = $false
          try {
            if ($cert.Subject -eq $cert.Issuer) {
              # Trust self-signed cert in LocalMachine\Root (no UI prompt when elevated) so WinVerifyTrust returns Valid.
              $publicCert = [System.Security.Cryptography.X509Certificates.X509Certificate2]::new($cert.RawData)
              $rootStore = [System.Security.Cryptography.X509Certificates.X509Store]::new("Root", "LocalMachine")
              $rootStore.Open([System.Security.Cryptography.X509Certificates.OpenFlags]::ReadWrite)
              if (-not ($rootStore.Certificates | Where-Object { $_.Thumbprint -eq $publicCert.Thumbprint })) {
                $rootStore.Add($publicCert)
                $addedToRoot = $true
              }
            }
            $signParams = @{
              FilePath      = "dist\wb\wb.exe"
              Certificate   = $cert
              HashAlgorithm = "SHA256"
            }
            if ($env:WIN_SIGNING_TIMESTAMP_URL) {
              $signParams["TimestampServer"] = $env:WIN_SIGNING_TIMESTAMP_URL
            }
            $sig = Set-AuthenticodeSignature @signParams
            $verified = Get-AuthenticodeSignature -FilePath "dist\wb\wb.exe"
            if ($sig.Status -ne "Valid" -or $verified.Status -ne "Valid") {
              Write-Error "Authenticode signing failed: Status=$($verified.Status) $($sig.StatusMessage)"
              exit 1
            }
            if ($env:WIN_SIGNING_EXPECTED_THUMBPRINT -and ($verified.SignerCertificate.Thumbprint -ne $env:WIN_SIGNING_EXPECTED_THUMBPRINT)) {
              Write-Error "Signer thumbprint mismatch: got $($verified.SignerCertificate.Thumbprint), expected $env:WIN_SIGNING_EXPECTED_THUMBPRINT"
              exit 1
            }
            "SIGNATURE_STATUS=signed" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            Write-Output "Signed dist\wb\wb.exe -> Status=$($verified.Status) Thumbprint=$($cert.Thumbprint)"
          } catch {
            Write-Error "Authenticode signing failed: $($_.Exception.Message)"
            exit 1
          } finally {
            if ($addedToRoot -and $rootStore -and $publicCert) {
              $rootStore.Remove($publicCert)
            }
            if ($rootStore) { $rootStore.Dispose() }
            if ($publicCert) { $publicCert.Dispose() }
            $cert.Dispose()
          }

      - name: Package and verify Winget portable zip
        run: |
          uv run --group release --frozen python bin/build_winget.py --package-only
          (cd dist && sha256sum -c winbearable-*.zip.sha256)

      - name: Generate release Winget manifests with real SHA256
        shell: bash
        run: |
          mkdir -p dist/winget
          ZIP_SHA=$(awk '{print toupper($1)}' dist/winbearable-*.zip.sha256 | head -n 1)
          cp packaging/winget/*.yaml dist/winget/
          sed -i "s/PENDING_RELEASE_BUILD_SHA256/${ZIP_SHA}/g" dist/winget/*.installer.yaml

      - name: Attest Winget portable zip provenance
        uses: actions/attest-build-provenance@9d57eef8c06cd9d6b433effeeb7a6a77b3ff94ad # v4.2.2
        with:
          subject-path: dist/winbearable-*.zip

      - name: Upload Winget zip and manifests to release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          files: |
            dist/winbearable-*.zip
            dist/winbearable-*.zip.sha256
            dist/winget/*.yaml
          token: ${{ secrets.GITHUB_TOKEN }}

  sbom:
    name: Generate and Upload SBOM
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && (inputs.job == 'all' || inputs.job == 'publish' || inputs.job == 'draft-release'))
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Generate SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Upload SBOM Artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: sbom
          path: sbom.spdx.json
