[project]
name = "winbearable"
dynamic = ["version"]
description = "Make Windows + WSL2 bearable (and locked down) for Linux people who are stuck with it — pure native Python, zero PowerShell wrappers."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "hellqvio" }]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Operating System :: Microsoft :: Windows :: Windows 11",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: System :: Systems Administration",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
tui = ["textual>=0.80.0"]

[project.scripts]
wb = "winbearable.cli:main"
winbearable = "winbearable.cli:main"

[project.urls]
Homepage = "https://github.com/hellqvio86/winbearable"
Documentation = "https://github.com/hellqvio86/winbearable#readme"
Repository = "https://github.com/hellqvio86/winbearable.git"
Issues = "https://github.com/hellqvio86/winbearable/issues"
Funding = "https://github.com/sponsors/hellqvio86"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/winbearable/const.py"

[tool.hatch.build.targets.wheel]
packages = ["src/winbearable"]

[tool.hatch.build.targets.wheel.force-include]
"profiles" = "winbearable/profiles"

[dependency-groups]
dev = [
  "pytest>=8.0.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.6.0",
  "mypy>=1.11.0",
]

[tool.mypy]
strict = true
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = []

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["src/tests"]
markers = [
  "windows_integration: safe real-Windows integration tests (requires WINBEARABLE_RUN_WINDOWS_INTEGRATION=1 on win32)",
]

[tool.coverage.run]
source = ["src/winbearable"]
omit = ["src/winbearable/__main__.py"]

[tool.coverage.report]
fail_under = 80
show_missing = true
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "class .*\\(Protocol\\):",
  "if __name__ == .__main__.:",
]
