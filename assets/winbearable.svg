<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">winbearable</title>
  <desc id="desc">A minimal bear-shaped terminal mark for winbearable.</desc>
  <defs>
    <linearGradient id="field" x1="64" y1="32" x2="448" y2="480" gradientUnits="userSpaceOnUse">
      <stop stop-color="#202B3D"/>
      <stop offset="1" stop-color="#101722"/>
    </linearGradient>
  </defs>

  <!-- Quiet, substantial canvas -->
  <rect x="16" y="16" width="480" height="480" rx="116" fill="url(#field)"/>

  <!-- Bear: deliberately reduced to a single, memorable silhouette -->
  <path d="M132 151
    C113 126 119 91 143 76
    C169 60 201 72 216 102
    C242 94 270 94 296 102
    C311 72 343 60 369 76
    C393 91 399 126 380 151
    C408 181 426 222 426 270
    C426 355 361 414 256 414
    C151 414 86 355 86 270
    C86 222 104 181 132 151Z"
    fill="#F2F5F8"/>

  <!-- Recessed ears give the silhouette its character -->
  <path d="M151 125C145 111 153 96 166 94C179 92 190 103 191 119C177 120 163 122 151 125Z"
        fill="#263449"/>
  <path d="M361 125C367 111 359 96 346 94C333 92 322 103 321 119C335 120 349 122 361 125Z"
        fill="#263449"/>

  <!-- Faceplate / terminal field -->
  <path d="M143 218C143 190 166 168 194 168H318C346 168 369 190 369 218V293C369 337 326 366 256 366C186 366 143 337 143 293V218Z"
        fill="#172334"/>

  <!-- Terminal prompt -->
  <path d="M194 236L235 267L194 298"
        fill="none" stroke="#F2F5F8" stroke-width="17"
        stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M257 299H318"
        fill="none" stroke="#65D6A5" stroke-width="17"
        stroke-linecap="round"/>

  <!-- Small eyes keep it bear-like, not mascot-like -->
  <circle cx="190" cy="202" r="6" fill="#F2F5F8"/>
  <circle cx="322" cy="202" r="6" fill="#F2F5F8"/>
</svg>
