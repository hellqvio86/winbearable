# winbearable profile: owner
# Target: Personal or ex-work machine where you have Administrator rights.
# Inherits all per-user tweaks from user-only.toml and adds machine-wide policy & hardening tweaks.

name = "owner"
extends = "user-only"
description = "Full-control profile for machine owners: user-only tweaks plus machine-wide OneDrive policy block, Recall/Copilot removal, minimal telemetry, and baseline CIS hardening."

[wsl]
enabled = true
mode = "convenient"
networking_mode = "mirrored"
dns_tunneling = true
firewall = true
auto_proxy = true
systemd = true

[tweaks]
# --- OneDrive & Consumer Bloat (Admin Policy) ---
# Source: https://learn.microsoft.com/en-us/sharepoint/use-group-policy
"onedrive.disable_policy" = true
# Source: https://learn.microsoft.com/en-us/windows/configuration/provisioning-packages/provisioning-CSP-ref
"bloat.disable_consumer_features" = true

# --- AI & Telemetry (Admin Policy & Scheduled Tasks) ---
# Source: https://learn.microsoft.com/en-us/windows/privacy/manage-windows-recall
"ai.disable_copilot_machine" = true
"ai.disable_recall" = true
"ai.disable_recall_feature" = true
"ai.disable_notepad_paint_ai" = true
"privacy.telemetry_minimal" = true
"telemetry.disable_scheduled_tasks" = true

# --- Native Hardening (Admin Policy, CIS Benchmark) ---
"hardening.disable_smbv1" = true
"hardening.disable_llmnr" = true
"hardening.disable_mdns" = true
"hardening.disable_netbios_broadcast" = true
"hardening.disable_wpad" = true
"hardening.disable_autorun" = true
"hardening.enable_firewall_all_profiles" = true
"hardening.defender_cloud_and_pua" = true
"hardening.disable_guest_and_blank_passwords" = true
"hardening.browser_privacy_baseline" = true
"hardening.office_macro_ole" = true
"hardening.powershell_scriptblock_logging" = true
"hardening.cmdline_process_audit" = true
